name: Seed Convex DB

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Exact Convex deployment ref (for example dev:name or prod:name)"
        required: true
        type: string
      confirmation:
        description: "Enter SEED:<deployment>, exactly matching the deployment above"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seed-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit confirmation
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment }}
          PROVIDED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test -n "$TARGET_DEPLOYMENT"
          test "$PROVIDED_CONFIRMATION" = "SEED:$TARGET_DEPLOYMENT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Convex seed
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ inputs.deployment }}
        run: pnpm run seed
